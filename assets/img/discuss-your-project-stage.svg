      <ellipse cx="700" cy="244" rx="345" ry="34" fill="url(#floorLight)" filter="url(#softGlow)"/>
    </g>
    <!-- The central line of copy is real, selectable SVG text. -->
    <g class="headline" filter="url(#wordShadow)">
