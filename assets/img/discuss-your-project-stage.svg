  <style><![CDATA[
    /* Edit these if you need a different curtain opening speed/width. */
    .curtain-left { transform-box: view-box; transform-origin: 0px 0px; animation: revealLeft 2.35s cubic-bezier(.64,.03,.13,1) .25s both; }
    .curtain-right { transform-box: view-box; transform-origin: 1400px 0px; animation: revealRight 2.35s cubic-bezier(.64,.03,.13,1) .25s both; }
    .headline { opacity: 0; animation: revealType 1.0s ease-out 1.45s both; }
    .rule { opacity: 0; animation: revealRule .9s ease-out 1.75s both; }
    @keyframes revealLeft { 0% { transform: scaleX(1); } 100% { transform: scaleX(.265); } }
    @keyframes revealRight { 0% { transform: scaleX(1); } 100% { transform: scaleX(.265); } }
    @keyframes revealType { 0% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes revealRule { 0% { opacity: 0; } 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .curtain-left, .curtain-right, .headline, .rule { animation: none !important; }
      .curtain-left, .curtain-right { transform: scaleX(.265) !important; }
      .headline, .rule { opacity: 1 !important; }
    }
  ]]></style>

  <g clip-path="url(#stageBounds)">
