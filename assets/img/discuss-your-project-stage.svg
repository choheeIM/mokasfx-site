      <circle cx="700" cy="192" r="3" fill="#d5a96d" stroke="none"/>
      <line x1="770" x2="864" y1="192" y2="192" stroke-opacity=".65"/>
    </g>
    <rect y="251" width="1400" height="49" fill="url(#floorFill)"/>
    <line x1="0" y1="250.7" x2="1400" y2="250.7" stroke="#c3a276" stroke-opacity=".34" stroke-width="2"/>
    <ellipse cx="700" cy="253" rx="370" ry="14" fill="url(#floorLight)" opacity=".5"/>
    <g stroke="#a1a4b4" stroke-opacity=".10" stroke-width="1">
